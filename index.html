<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #0d0f1a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecff;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #wrap {
    position: relative;
    width: 880px;
    max-width: 96vw;
  }
  #game {
    display: block;
    width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #2a2f4a, 0 20px 60px rgba(0,0,0,.6);
    background: #11131f;
    cursor: default;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 14px; left: 14px; right: 14px;
    display: flex;
    gap: 8px;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    font-weight: 600;
    text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .pill {
    background: rgba(20,24,40,.65);
    border: 1px solid #2f3658;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 14px;
    backdrop-filter: blur(4px);
  }
  .pill b { color: #7fffd4; }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(8,10,18,.78);
    backdrop-filter: blur(6px);
    border-radius: 12px;
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 44px;
    letter-spacing: 2px;
    background: linear-gradient(90deg,#7fffd4,#73c2ff,#c08cff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 8px;
  }
  #overlay p { color: #aab3d6; line-height: 1.7; margin-bottom: 6px; }
  #overlay .keys { margin: 14px 0; font-size: 14px; color: #8893bd; }
  #overlay .keys span {
    display: inline-block;
    background: #1b2036;
    border: 1px solid #313862;
    border-radius: 6px;
    padding: 3px 9px;
    margin: 3px;
    color: #cdd6ff;
  }
  button#start {
    margin-top: 16px;
    font-size: 18px;
    font-weight: 700;
    color: #0d0f1a;
    background: linear-gradient(90deg,#7fffd4,#73c2ff);
    border: none;
    padding: 12px 34px;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: 0 8px 24px rgba(115,194,255,.35);
  }
  button#start:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(115,194,255,.5); }
  #tip {
    position: absolute;
    bottom: 12px; left: 0; right: 0;
    text-align: center;
    font-size: 12px;
    color: #5b6390;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="880" height="620"></canvas>
  <div id="hud">
    <div class="pill">❤ 血量 <b id="hp">100</b></div>
    <div class="pill">👾 波次 <b id="wave">1</b></div>
    <div class="pill">⭐ 分数 <b id="score">0</b></div>
  </div>
  <div id="overlay">
    <h1>坦克大战</h1>
    <p>控制你的坦克，消灭所有敌方坦克，守住阵地！</p>
    <div class="keys">
      <span>W A S D / 方向键 移动</span>
      <span>自动瞄准 + 自动开火</span>
      <span>空格 手动开火</span>
      <span>P 暂停</span>
    </div>
    <p style="font-size:13px;color:#6f78a8;">击毁坦克有概率掉落 buff：治疗 / 多发子弹 / 队友支援。</p>
    <button id="start">开始游戏</button>
  </div>
  <div id="tip">提示：自动锁定最近的敌人开火，开过去捡 buff 球获得增益；贴着掩体可挡子弹。</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const hpEl = document.getElementById('hp');
  const waveEl = document.getElementById('wave');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');

  // ---- 输入 ----
  const keys = {};
  addEventListener('keydown', e => {
    if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    keys[e.key.toLowerCase()] = true;
    if (e.key.toLowerCase() === 'p' && state.running) togglePause();
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ---- 工具 ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- 障碍物布局 ----
  // 类型: 'wall' (可被子弹摧毁) / 'steel' (不可摧毁)
  let obstacles = [];
  function buildObstacles() {
    obstacles = [];
    const blocks = [
      [140, 120, 200, 26, 'steel'],
      [540, 120, 200, 26, 'steel'],
      [140, 470, 200, 26, 'steel'],
      [540, 470, 200, 26, 'steel'],
      [400, 240, 26, 140, 'wall'],
      [260, 300, 26, 140, 'wall'],
      [594, 300, 26, 140, 'wall'],
      [300, 90, 26, 120, 'wall'],
      [554, 90, 26, 120, 'wall'],
      [300, 410, 26, 120, 'wall'],
      [554, 410, 26, 120, 'wall'],
    ];
    for (const [x, y, w, h, t] of blocks) obstacles.push({ x, y, w, h, type: t, hp: t === 'wall' ? 3 : Infinity });
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function circleRect(cx, cy, r, rect) {
    const nx = clamp(cx, rect.x, rect.x + rect.w);
    const ny = clamp(cy, rect.y, rect.y + rect.h);
    return dist(cx, cy, nx, ny) < r;
  }

  // ---- 实体 ----
  const player = {
    x: W/2, y: H - 70, r: 18, speed: 3.4,
    angle: -Math.PI/2, hp: 100, maxHp: 100,
    cooldown: 0, multishot: 0, color: '#7fffd4',
  };
  let bullets = [];
  let enemies = [];
  let teammates = [];
  let buffs = [];
  let particles = [];
  let floaters = [];

  function spawnEnemy() {
    const side = Math.floor(rand(0, 3));
    let x, y;
    if (side === 0) { x = rand(40, W-40); y = -30; }
    else if (side === 1) { x = -30; y = rand(60, H-120); }
    else { x = W + 30; y = rand(60, H-120); }
    enemies.push({
      x, y, r: 17, speed: rand(1.1, 1.9),
      angle: 0, hp: 3, maxHp: 3,
      cooldown: rand(40, 120), color: '#ff7b7b',
    });
  }

  function fireBullet(obj, fromEnemy, angleOverride) {
    const a = angleOverride !== undefined ? angleOverride : obj.angle;
    const sp = 7.5;
    bullets.push({
      x: obj.x + Math.cos(a) * (obj.r + 4),
      y: obj.y + Math.sin(a) * (obj.r + 4),
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      r: 4, fromEnemy: !!fromEnemy, life: 120,
    });
  }

  function firePlayer() {
    if (player.multishot > 0) {
      for (const off of [-0.2, 0, 0.2]) fireBullet(player, false, player.angle + off);
    } else {
      fireBullet(player, false);
    }
  }

  function burst(x, y, color, n=14) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI*2), s = rand(1, 4);
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: rand(20, 40), color });
    }
  }

  function buffColor(type) {
    return type === 'heal' ? '#7fffd4' : type === 'multishot' ? '#ffd27b' : '#9b8cff';
  }
  function buffIcon(type) {
    return type === 'heal' ? '+' : type === 'multishot' ? '⋙' : '♥';
  }
  function floatText(x, y, text, color) {
    floaters.push({ x, y, text, color, life: 50 });
  }
  function maybeDropBuff(x, y) {
    if (Math.random() < 0.45) {
      const types = ['heal', 'multishot', 'teammate'];
      const type = types[Math.floor(Math.random() * types.length)];
      buffs.push({ x, y, r: 13, type, pulse: 0, life: 720 });
    }
  }
  function applyBuff(type) {
    if (type === 'heal') {
      player.hp = Math.min(player.maxHp, player.hp + 35);
      updateHUD();
      floatText(player.x, player.y - 34, '+35 HP', '#7fffd4');
    } else if (type === 'multishot') {
      player.multishot = 720;
      floatText(player.x, player.y - 34, '多发子弹!', '#ffd27b');
    } else if (type === 'teammate') {
      if (teammates.length < 2) {
        teammates.push({ x: player.x - 36, y: player.y + 36, r: 16, angle: 0, hp: 30, maxHp: 30, cooldown: 0 });
        floatText(player.x, player.y - 34, '队友支援!', '#9b8cff');
      } else {
        player.hp = Math.min(player.maxHp, player.hp + 25); updateHUD();
        floatText(player.x, player.y - 34, '+25 HP', '#7fffd4');
      }
    }
  }

  // ---- 游戏状态 ----
  const state = { running: false, paused: false, over: false, win: false, wave: 1, score: 0, toSpawn: 0, spawnTimer: 0 };

  function startGame() {
    buildObstacles();
    player.x = W/2; player.y = H - 70; player.hp = player.maxHp;
    player.angle = -Math.PI/2; player.multishot = 0;
    bullets = []; enemies = []; teammates = []; buffs = []; particles = []; floaters = [];
    state.running = true; state.paused = false; state.over = false; state.win = false;
    state.wave = 1; state.score = 0;
    startWave(1);
    overlay.classList.add('hidden');
    updateHUD();
  }

  function startWave(n) {
    state.wave = n;
    state.toSpawn = 2 + n;
    state.spawnTimer = 0;
    updateHUD();
  }

  function gameOver(win) {
    state.running = false; state.over = true; state.win = win;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = win ? '🏆 胜利！' : '💥 游戏结束';
    overlay.querySelector('p').innerHTML = win
      ? `你守住了所有阵地！<br>最终分数 <b style="color:#7fffd4">${state.score}</b>`
      : `你被击毁了。<br>分数 <b style="color:#7fffd4">${state.score}</b> · 到达第 <b style="color:#7fffd4">${state.wave}</b> 波`;
    startBtn.textContent = '再来一局';
  }

  function togglePause() {
    state.paused = !state.paused;
    if (state.paused) {
      overlay.classList.remove('hidden');
      overlay.querySelector('h1').textContent = '⏸ 已暂停';
      overlay.querySelector('p').textContent = '按 P 或点击下方按钮继续';
      startBtn.textContent = '继续';
    } else {
      overlay.classList.add('hidden');
    }
  }

  function updateHUD() {
    hpEl.textContent = Math.max(0, Math.round(player.hp));
    waveEl.textContent = state.wave;
    scoreEl.textContent = state.score;
  }

  // ---- 碰撞：障碍 + 边界（可贴墙滑动）----
  function slideMove(obj, nx, ny) {
    let x = clamp(nx, obj.r, W - obj.r);
    let y = clamp(ny, obj.r, H - obj.r);
    const boxX = { x: x - obj.r, y: obj.y - obj.r, w: obj.r*2, h: obj.r*2 };
    if (obstacles.some(o => rectsOverlap(boxX, o))) x = obj.x;
    const boxY = { x: x - obj.r, y: y - obj.r, w: obj.r*2, h: obj.r*2 };
    if (obstacles.some(o => rectsOverlap(boxY, o))) y = obj.y;
    return { x, y };
  }
  function pushOutOfObstacles(obj) {
    for (const o of obstacles) {
      const box = { x: obj.x - obj.r, y: obj.y - obj.r, w: obj.r*2, h: obj.r*2 };
      if (!rectsOverlap(box, o)) continue;
      const left = (obj.x + obj.r) - o.x;
      const right = (o.x + o.w) - (obj.x - obj.r);
      const top = (obj.y + obj.r) - o.y;
      const bottom = (o.y + o.h) - (obj.y - obj.r);
      const m = Math.min(left, right, top, bottom);
      if (m === left) obj.x = o.x - obj.r;
      else if (m === right) obj.x = o.x + o.w + obj.r;
      else if (m === top) obj.y = o.y - obj.r;
      else obj.y = o.y + o.h + obj.r;
    }
    obj.x = clamp(obj.x, obj.r, W - obj.r);
    obj.y = clamp(obj.y, obj.r, H - obj.r);
  }

  function update() {
    if (!state.running || state.paused) return;

    // --- 玩家移动（简单：WASD / 方向键）---
    let dx = 0, dy = 0;
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
    if (dx || dy) {
      const len = Math.hypot(dx, dy);
      const mv = slideMove(player, player.x + dx/len * player.speed, player.y + dy/len * player.speed);
      player.x = mv.x; player.y = mv.y;
    }
    // 自动瞄准最近的敌人 + 自动开火
    let target = null, best = 1e9;
    for (const e of enemies) { const dd = dist(player.x, player.y, e.x, e.y); if (dd < best) { best = dd; target = e; } }
    if (target) player.angle = Math.atan2(target.y - player.y, target.x - player.x);
    if (player.multishot > 0) player.multishot--;
    player.cooldown--;
    if (player.cooldown <= 0 && (target || keys[' '])) {
      firePlayer();
      player.cooldown = 16;
    }

    // --- 敌人生成 ---
    if (state.toSpawn > 0) {
      state.spawnTimer--;
      if (state.spawnTimer <= 0) {
        spawnEnemy();
        state.toSpawn--;
        state.spawnTimer = 70;
      }
    } else if (enemies.length === 0) {
      if (state.wave >= 8) { gameOver(true); return; }
      startWave(state.wave + 1);
    }

    // --- 敌人 AI：直奔玩家，保持间距，不重叠不卡墙 ---
    const minDistToPlayer = 30;
    for (const e of enemies) {
      const ang = Math.atan2(player.y - e.y, player.x - e.x);
      const d = dist(e.x, e.y, player.x, player.y);
      let nx = e.x, ny = e.y;
      if (d > e.r + player.r + minDistToPlayer) {
        nx = e.x + Math.cos(ang) * e.speed;
        ny = e.y + Math.sin(ang) * e.speed;
      }
      const mv = slideMove(e, nx, ny);
      e.x = mv.x; e.y = mv.y;
      e.angle = ang;
      e.cooldown--;
      if (e.cooldown <= 0 && d < 460) { fireBullet(e, true); e.cooldown = rand(70, 130); }
    }
    // 敌人之间互相分离（避免叠在一起 / 地下转圈）
    for (let i = 0; i < enemies.length; i++) {
      for (let j = i + 1; j < enemies.length; j++) {
        const a = enemies[i], b = enemies[j];
        const d = dist(a.x, a.y, b.x, b.y);
        const min = a.r + b.r;
        if (d > 0 && d < min) {
          const push = (min - d) / 2;
          const ux = (a.x - b.x) / d, uy = (a.y - b.y) / d;
          a.x += ux * push; a.y += uy * push;
          b.x -= ux * push; b.y -= uy * push;
        }
      }
    }
    // 敌人不挤到玩家身上 + 修正卡墙
    for (const e of enemies) {
      const d = dist(e.x, e.y, player.x, player.y);
      const min = e.r + player.r;
      if (d > 0 && d < min) {
        const push = min - d;
        e.x += (e.x - player.x) / d * push;
        e.y += (e.y - player.y) / d * push;
      }
      pushOutOfObstacles(e);
    }

    // --- 队友 AI：跟随玩家、自动攻击最近敌人 ---
    for (const tm of teammates) {
      const tx = player.x - Math.cos(player.angle) * 46;
      const ty = player.y - Math.sin(player.angle) * 46;
      const d = dist(tm.x, tm.y, tx, ty);
      if (d > 8) {
        const a = Math.atan2(ty - tm.y, tx - tm.x);
        const mv = slideMove(tm, tm.x + Math.cos(a) * 2.8, tm.y + Math.sin(a) * 2.8);
        tm.x = mv.x; tm.y = mv.y;
      }
      let tgt = null, bd = 1e9;
      for (const e of enemies) { const dd = dist(tm.x, tm.y, e.x, e.y); if (dd < bd) { bd = dd; tgt = e; } }
      if (tgt) {
        tm.angle = Math.atan2(tgt.y - tm.y, tgt.x - tm.x);
        tm.cooldown--;
        if (tm.cooldown <= 0 && bd < 460) { fireBullet(tm, false); tm.cooldown = 26; }
      }
      pushOutOfObstacles(tm);
    }

    // --- 子弹 ---
    for (const b of bullets) {
      b.x += b.vx; b.y += b.vy; b.life--;
      if (b.x < 0 || b.x > W || b.y < 0 || b.y > H) b.life = 0;
      for (const o of obstacles) {
        if (circleRect(b.x, b.y, b.r, o)) {
          b.life = 0;
          if (o.type === 'wall') {
            o.hp--;
            burst(b.x, b.y, '#c89b6b', 6);
            if (o.hp <= 0) { o.dead = true; burst(o.x+o.w/2, o.y+o.h/2, '#c89b6b', 16); }
          } else {
            burst(b.x, b.y, '#9fb0d0', 8);
          }
          break;
        }
      }
      if (b.life <= 0) continue;
      if (b.fromEnemy) {
        if (dist(b.x, b.y, player.x, player.y) < player.r + b.r) {
          player.hp -= 9; b.life = 0; burst(player.x, player.y, '#ff5b5b', 10);
          updateHUD();
          if (player.hp <= 0) { gameOver(false); return; }
        } else {
          for (const tm of teammates) {
            if (dist(b.x, b.y, tm.x, tm.y) < tm.r + b.r) {
              tm.hp -= 9; b.life = 0; burst(tm.x, tm.y, '#9b8cff', 10);
              if (tm.hp <= 0) { tm.dead = true; burst(tm.x, tm.y, '#9b8cff', 16); }
              break;
            }
          }
        }
      } else {
        for (const e of enemies) {
          if (dist(b.x, b.y, e.x, e.y) < e.r + b.r) {
            e.hp -= 1; b.life = 0; burst(e.x, e.y, '#ffd27b', 10);
            if (e.hp <= 0) {
              e.dead = true; state.score += 10 * state.wave;
              burst(e.x, e.y, '#ff7b7b', 18);
              maybeDropBuff(e.x, e.y);
              updateHUD();
            }
            break;
          }
        }
      }
    }
    bullets = bullets.filter(b => b.life > 0);
    obstacles = obstacles.filter(o => !o.dead);
    enemies = enemies.filter(e => !e.dead);
    teammates = teammates.filter(t => !t.dead);

    // --- buff 掉落物 ---
    for (const bf of buffs) {
      bf.pulse += 0.1; bf.life--;
      if (dist(bf.x, bf.y, player.x, player.y) < player.r + bf.r) {
        applyBuff(bf.type); bf.dead = true;
        burst(bf.x, bf.y, buffColor(bf.type), 14);
      }
    }
    buffs = buffs.filter(b => !b.dead && b.life > 0);

    // --- 粒子 / 飘字 ---
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.life--; p.vx *= 0.94; p.vy *= 0.94; }
    particles = particles.filter(p => p.life > 0);
    for (const f of floaters) { f.y -= 0.5; f.life--; }
    floaters = floaters.filter(f => f.life > 0);
  }

  // ---- 渲染 ----
  function drawTank(t, kind) {
    let body, turret, dome;
    if (kind === 'player') { body = t.color; turret = '#36c9a6'; dome = '#d7fff4'; }
    else if (kind === 'ally') { body = '#9b8cff'; turret = '#6c5bd6'; dome = '#e6e0ff'; }
    else { body = '#3a2230'; turret = '#ff5b5b'; dome = '#ffd7d7'; }
    ctx.save();
    ctx.translate(t.x, t.y);
    ctx.rotate(t.angle);
    ctx.fillStyle = '#1b2036';
    ctx.fillRect(-t.r, -t.r-4, t.r*2, 6);
    ctx.fillRect(-t.r, t.r-2, t.r*2, 6);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(0, 0, t.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = turret;
    ctx.fillRect(0, -5, t.r + 14, 10);
    ctx.beginPath(); ctx.arc(0, 0, t.r*0.45, 0, Math.PI*2);
    ctx.fillStyle = dome; ctx.fill();
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = '#11131f';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.03)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= W; x += 40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

    // 障碍物
    for (const o of obstacles) {
      if (o.type === 'steel') {
        ctx.fillStyle = '#44507a';
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#6c7bb0'; ctx.lineWidth = 2;
        ctx.strokeRect(o.x+2, o.y+2, o.w-4, o.h-4);
      } else {
        const dmg = o.hp <= 1 ? '#8a6a44' : (o.hp === 2 ? '#a9824f' : '#c89b6b');
        ctx.fillStyle = dmg;
        ctx.fillRect(o.x, o.y, o.w, o.h);
        ctx.strokeStyle = '#5e4628'; ctx.lineWidth = 2;
        for (let i = o.x; i < o.x + o.w; i += 14) { ctx.beginPath(); ctx.moveTo(i, o.y); ctx.lineTo(i, o.y+o.h); ctx.stroke(); }
      }
    }

    // buff 掉落物
    for (const bf of buffs) {
      const col = buffColor(bf.type);
      const pr = bf.r + Math.sin(bf.pulse) * 2;
      ctx.globalAlpha = bf.life < 120 ? Math.max(0.2, bf.life/120) : 1;
      ctx.shadowColor = col; ctx.shadowBlur = 14;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(bf.x, bf.y, pr, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#0d0f1a';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(buffIcon(bf.type), bf.x, bf.y + 1);
      ctx.globalAlpha = 1;
    }

    // 队友
    for (const tm of teammates) {
      drawTank(tm, 'ally');
      const bw = 34, bx = tm.x - bw/2, by = tm.y - tm.r - 14;
      ctx.fillStyle = '#000'; ctx.fillRect(bx-1, by-1, bw+2, 5);
      ctx.fillStyle = '#5b6390'; ctx.fillRect(bx, by, bw, 3);
      ctx.fillStyle = '#9b8cff'; ctx.fillRect(bx, by, bw * clamp(tm.hp/tm.maxHp,0,1), 3);
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = clamp(p.life / 40, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 子弹
    for (const b of bullets) {
      ctx.fillStyle = b.fromEnemy ? '#ff6b6b' : '#9bffea';
      ctx.shadowColor = b.fromEnemy ? '#ff6b6b' : '#9bffea';
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }

    // 敌人
    for (const e of enemies) drawTank(e, 'enemy');
    // 玩家
    if (!state.over) drawTank(player, 'player');

    // 玩家血条 + 增益状态
    if (!state.over) {
      const bw = 40, bx = player.x - bw/2, by = player.y - player.r - 16;
      ctx.fillStyle = '#000'; ctx.fillRect(bx-1, by-1, bw+2, 6);
      ctx.fillStyle = '#ff5b5b'; ctx.fillRect(bx, by, bw, 4);
      ctx.fillStyle = '#7fffd4'; ctx.fillRect(bx, by, bw * clamp(player.hp/player.maxHp,0,1), 4);
      if (player.multishot > 0) {
        ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#ffd27b';
        ctx.fillText('⚡多发 ' + Math.ceil(player.multishot/60) + 's', player.x, by - 4);
      }
    }

    // 飘字提示
    for (const f of floaters) {
      ctx.globalAlpha = clamp(f.life / 50, 0, 1);
      ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = f.color;
      ctx.fillText(f.text, f.x, f.y);
      ctx.globalAlpha = 1;
    }
  }

  function loop() {
    update();
    render();
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener('click', () => {
    if (state.paused) { togglePause(); return; }
    startGame();
  });

  buildObstacles();
  render();
  loop();
})();
</script>
</body>
</html>
