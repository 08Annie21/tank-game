<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>坦克大战 · Tank Battle 2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #0d0f1a;
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8ecff;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  #wrap { position: relative; width: 880px; max-width: 96vw; }
  #game {
    display: block; width: 100%;
    border-radius: 12px;
    box-shadow: 0 0 0 2px #2a2f4a, 0 20px 60px rgba(0,0,0,.6);
    background: #11131f; cursor: default; touch-action: none;
  }
  #hud {
    position: absolute; top: 14px; left: 14px; right: 14px;
    display: flex; gap: 8px; justify-content: space-between; align-items: center;
    pointer-events: none; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,.8);
  }
  .pill { background: rgba(20,24,40,.65); border: 1px solid #2f3658; padding: 6px 12px; border-radius: 999px; font-size: 14px; backdrop-filter: blur(4px); }
  .pill b { color: #7fffd4; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,10,18,.82); backdrop-filter: blur(6px); border-radius: 12px; text-align: center; padding: 24px; }
  #overlay.hidden { display: none; }
  #overlay h1 { font-size: 42px; letter-spacing: 2px; background: linear-gradient(90deg,#7fffd4,#73c2ff,#c08cff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 10px; }
  #overlay p { color: #aab3d6; line-height: 1.7; margin-bottom: 6px; font-size: 14px; }
  #overlay .keys { margin: 8px 0; font-size: 13px; color: #8893bd; }
  #overlay .keys span { display: inline-block; background: #1b2036; border: 1px solid #313862; border-radius: 6px; padding: 3px 9px; margin: 3px; color: #cdd6ff; }
  .row { margin: 10px 0; }
  .row .label { color: #8893bd; font-size: 13px; margin-bottom: 8px; }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .chip { background: rgba(20,24,40,.7); border: 1px solid #2f3658; color: #cdd6ff; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; transition: all .12s; min-width: 80px; }
  .chip:hover { border-color: #7fffd4; }
  .chip.active { background: linear-gradient(90deg,rgba(123,255,212,.25),rgba(115,194,255,.25)); border-color: #7fffd4; color: #7fffd4; box-shadow: 0 0 12px rgba(123,255,212,.3); }
  .chip.swatch { display: flex; align-items: center; gap: 6px; }
  .swatch-dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid #0006; }
  button#start { margin-top: 18px; font-size: 18px; font-weight: 700; color: #0d0f1a; background: linear-gradient(90deg,#7fffd4,#73c2ff); border: none; padding: 12px 34px; border-radius: 999px; cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; box-shadow: 0 8px 24px rgba(115,194,255,.35); }
  button#start:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(115,194,255,.5); }
  #tip { position: absolute; bottom: 12px; left: 0; right: 0; text-align: center; font-size: 12px; color: #5b6390; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="880" height="620"></canvas>
  <div id="hud">
    <div class="pill">❤ 血量 <b id="hp">100</b></div>
    <div class="pill">👾 波次 <b id="wave">1</b></div>
    <div class="pill">⭐ 分数 <b id="score">0</b></div>
    <div class="pill">💠 积分 <b id="coins">0</b></div>
  </div>
  <div id="overlay">
    <h1>坦克大战</h1>
    <p>选择地图与皮肤，消灭所有敌人，守住阵地！</p>
    <div class="row">
      <div class="label">🗺 地图</div>
      <div class="chips" id="mapChips"></div>
    </div>
    <div class="row">
      <div class="label">🎨 皮肤</div>
      <div class="chips" id="skinChips"></div>
    </div>
    <div class="keys">
      <span>W A S D / 方向键 移动</span>
      <span>1 2 3 选技能</span>
      <span>F 释放技能（消耗积分）</span>
      <span>P 暂停 · M 静音</span>
    </div>
    <p style="font-size:12px;color:#6f78a8;">第 4、8 波出现 BOSS；清空一波捡 buff；皮肤"丛林/沙漠/霓虹/烈焰"使用 AI 生成的坦克贴图。</p>
    <button id="start">开始游戏</button>
  </div>
  <div id="tip">提示：先选地图与皮肤，按"开始游戏"进入战场。第 4、8 波 BOSS 用技能集火！</div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const hpEl = document.getElementById('hp');
  const waveEl = document.getElementById('wave');
  const scoreEl = document.getElementById('score');
  const coinsEl = document.getElementById('coins');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start');
  const mapChipsEl = document.getElementById('mapChips');
  const skinChipsEl = document.getElementById('skinChips');

  // ---- 地图 ----
  const baseLayout = [
    [140,120,200,26,'steel'],[540,120,200,26,'steel'],[140,470,200,26,'steel'],[540,470,200,26,'steel'],
    [400,240,26,140,'wall'],[260,300,26,140,'wall'],[594,300,26,140,'wall'],
    [300,90,26,120,'wall'],[554,90,26,120,'wall'],[300,410,26,120,'wall'],[554,410,26,120,'wall'],
  ];
  const jungleLayout = [
    [120,140,160,26,'wall'],[600,140,160,26,'wall'],[120,460,160,26,'wall'],[600,460,160,26,'wall'],
    [260,200,30,80,'steel'],[590,200,30,80,'steel'],[260,370,30,80,'steel'],[590,370,30,80,'steel'],
    [340,250,200,18,'wall'],[340,360,200,18,'wall'],
    [430,80,20,180,'wall'],[430,360,20,180,'wall'],
    [230,320,60,60,'wall'],[590,320,60,60,'wall'],
  ];
  const desertLayout = [
    [160,120,160,26,'steel'],[560,120,160,26,'steel'],[160,460,160,26,'steel'],[560,460,160,26,'steel'],
    [80,280,26,160,'wall'],[774,280,26,160,'wall'],
    [320,260,30,120,'wall'],[530,300,30,120,'wall'],
    [200,200,140,26,'wall'],[540,380,140,26,'wall'],[200,340,140,26,'wall'],
    [440,140,26,100,'steel'],[440,380,26,100,'steel'],
  ];
  const MAPS = [
    { id:'base',   name:'基地', bg:['#1a1d2e','#0d0f1a'], gridAlpha:.03,
      wall:['#c89b6b','#5e4628'], steel:['#44507a','#6c7bb0'], decor:'base',   layout: baseLayout },
    { id:'jungle', name:'丛林', bg:['#1a3a1a','#0a1a0a'], gridAlpha:.02,
      wall:['#3b6b2a','#1f4a1a'], steel:['#2a5a2a','#5a8a4a'], decor:'jungle', layout: jungleLayout },
    { id:'desert', name:'沙漠', bg:['#4a3a20','#2a1f12'], gridAlpha:.02,
      wall:['#c89b6b','#7a5a2a'], steel:['#a87a3d','#d8b6a0'], decor:'desert', layout: desertLayout },
  ];

  // ---- 皮肤（4 张 AI 贴图 + 2 套程序化）----
  const SKINS = [
    { name:'经典', palette:{ body:'#7fffd4', turret:'#36c9a6', dome:'#d7fff4' } },
    { name:'丛林', palette:{ body:'#4a6b2a', turret:'#6b8a3a', dome:'#cfd9a8' }, src:'assets/skin_jungle.png' },
    { name:'沙漠', palette:{ body:'#c89b6b', turret:'#a87a3d', dome:'#f0d9a8' }, src:'assets/skin_desert.png' },
    { name:'霓虹', palette:{ body:'#ff73ff', turret:'#73c2ff', dome:'#e0f0ff' }, src:'assets/skin_neon.png' },
    { name:'烈焰', palette:{ body:'#ff5b3b', turret:'#ff8c3b', dome:'#ffd8b0' }, src:'assets/skin_flame.png' },
    { name:'暗夜', palette:{ body:'#6b4bff', turret:'#3b2bbf', dome:'#c8b8ff' } },
  ];
  for (const s of SKINS) {
    if (s.src) {
      const img = new Image();
      img.onload = () => { s.img = img; };
      img.onerror = () => { s.img = null; };
      img.src = s.src;
    }
  }

  // ---- 输入 ----
  const keys = {};
  addEventListener('keydown', e => {
    if ([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    const k = e.key.toLowerCase(); keys[k] = true;
    if (e.repeat) return;
    if (k === 'p' && state.running) togglePause();
    else if (k === 'm') toggleMute();
    else if (state.running && !state.paused) {
      if (k === 'f') activateSkill();
      else if (k === '1') selectSkill(0);
      else if (k === '2') selectSkill(1);
      else if (k === '3') selectSkill(2);
    }
  });
  addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

  // ---- 工具 ----
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  // ---- 音效 ----
  let audioCtx = null;
  function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  function tone(freq, dur, type='square', vol=0.06, slideTo=null) {
    if (!audioCtx || state.muted) return;
    const t = audioCtx.currentTime; const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t + dur);
  }
  function noise(dur, vol=0.12) {
    if (!audioCtx || state.muted) return;
    const t = audioCtx.currentTime, n = Math.floor(audioCtx.sampleRate * dur);
    const buf = audioCtx.createBuffer(1, n, audioCtx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const g = audioCtx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1300;
    src.connect(f).connect(g).connect(audioCtx.destination); src.start(t); src.stop(t + dur);
  }
  function playSound(name) {
    if (!audioCtx || state.muted) return;
    switch (name) {
      case 'shoot':    tone(720, 0.05, 'square', 0.04, 520); break;
      case 'explode':  noise(0.22, 0.12); break;
      case 'hit':      tone(150, 0.18, 'sawtooth', 0.08, 80); break;
      case 'buff':     tone(520, 0.09, 'triangle', 0.07, 780); setTimeout(() => tone(780, 0.10, 'triangle', 0.07, 1040), 90); break;
      case 'laser':    tone(900, 0.18, 'sawtooth', 0.06, 300); break;
      case 'launch':   tone(300, 0.18, 'square', 0.05, 700); break;
      case 'sword':    tone(600, 0.12, 'triangle', 0.06, 1200); setTimeout(() => tone(900, 0.12, 'triangle', 0.06, 1500), 80); break;
      case 'waveclear':tone(660, 0.12, 'triangle', 0.06, 990); setTimeout(() => tone(990, 0.16, 'triangle', 0.06, 1320), 120); break;
      case 'deny':     tone(200, 0.10, 'square', 0.04, 160); break;
    }
  }

  // ---- 障碍物 ----
  let obstacles = [];
  function buildObstacles() {
    const blocks = MAPS[state.mapIdx].layout;
    obstacles = [];
    for (const [x, y, w, h, t] of blocks) obstacles.push({ x, y, w, h, type: t, hp: t === 'wall' ? 3 : Infinity });
  }
  function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
  function circleRect(cx, cy, r, rect) {
    const nx = clamp(cx, rect.x, rect.x + rect.w), ny = clamp(cy, rect.y, rect.y + rect.h);
    return dist(cx, cy, nx, ny) < r;
  }

  // ---- 实体 ----
  const player = {
    x: W/2, y: H - 100, r: 18, speed: 3.4,
    angle: -Math.PI/2, hp: 100, maxHp: 100,
    cooldown: 0, multishot: 0,
  };
  let bullets = [], enemies = [], teammates = [], buffs = [], particles = [], floaters = [], missiles = [], effects = [];

  const SKILLS = [
    { name: '激光', cost: 50, cd: 40 }, { name: '导弹', cost: 45, cd: 55 }, { name: '剑气', cost: 70, cd: 70 },
  ];
  let activeSkill = 0, skillCd = [0, 0, 0];

  function spawnEnemy() {
    const side = Math.floor(rand(0, 3)); let x, y;
    if (side === 0) { x = rand(40, W-40); y = -30; }
    else if (side === 1) { x = -30; y = rand(60, H-120); }
    else { x = W + 30; y = rand(60, H-120); }
    const roll = Math.random(), w = state.wave;
    let type, r, hp, speed, color, dmg, cd;
    if (roll < 0.55) { type='grunt'; r=17; hp=3+Math.floor(w/3); speed=rand(1.2,2.0)+w*0.04; color='#ff7b7b'; dmg=9; cd=rand(60,120)-w*3; }
    else if (roll < 0.8) { type='fast'; r=14; hp=2+Math.floor(w/4); speed=rand(2.2,3.1); color='#ffd27b'; dmg=7; cd=rand(90,150); }
    else { type='heavy'; r=22; hp=7+Math.floor(w/2); speed=rand(0.8,1.3); color='#c06bff'; dmg=14; cd=rand(50,90); }
    cd = Math.max(30, cd);
    enemies.push({ x, y, r, speed, angle: 0, hp, maxHp: hp, cooldown: rand(20, cd), color, dmg, type });
  }
  function spawnBoss(n) {
    const hp = n === 8 ? 140 : 75;
    enemies.push({ x: W/2, y: -40, r: 46, speed: 1.15, angle: Math.PI/2, hp, maxHp: hp, cooldown: 60, color:'#ff3b6b', dmg: 12, type:'boss', boss:true, atkTimer:70, pattern:0, summonTimer:320 });
    spawnEnemy(); spawnEnemy();
    floatText(player.x, player.y - 50, '⚠ BOSS 来袭!', '#ff5b5b');
  }
  function updateBoss(e) {
    const ang = Math.atan2(player.y - e.y, player.x - e.x);
    const d = dist(e.x, e.y, player.x, player.y), want = 170;
    if (d > want + 25) { e.x += Math.cos(ang) * e.speed; e.y += Math.sin(ang) * e.speed; }
    else if (d < want - 25) { e.x -= Math.cos(ang) * e.speed; e.y -= Math.sin(ang) * e.speed; }
    e.angle = ang; pushOutOfObstacles(e);
    e.atkTimer--;
    if (e.atkTimer <= 0) {
      e.pattern = (e.pattern + 1) % 2;
      if (e.pattern === 0) { const N=14; for (let k=0;k<N;k++) fireBullet(e, true, ang + k/N*Math.PI*2, e.dmg); e.atkTimer = 110; }
      else { for (const off of [-0.18,0,0.18]) fireBullet(e, true, ang+off, e.dmg); e.atkTimer = 60; }
    }
    e.summonTimer--;
    if (e.summonTimer <= 0 && enemies.length < 7) { spawnEnemy(); e.summonTimer = 340; }
  }
  function onBossDeath(e) {
    burst(e.x, e.y, '#ff3b6b', 40); burst(e.x, e.y, '#ffd27b', 30);
    state.score += 200; state.coins += 200; updateHUD();
    spawnWaveBuffs(3); floatText(e.x, e.y - 20, 'BOSS 击破! +200', '#ffd27b'); playSound('waveclear');
  }

  function fireBullet(obj, fromEnemy, angleOverride, dmg) {
    const a = angleOverride !== undefined ? angleOverride : obj.angle, sp = 7.5;
    bullets.push({ x: obj.x + Math.cos(a) * (obj.r+4), y: obj.y + Math.sin(a) * (obj.r+4), vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r:4, fromEnemy:!!fromEnemy, dmg: dmg||9, life:120 });
  }
  function firePlayer() {
    playSound('shoot');
    if (player.multishot > 0) { for (const off of [-0.2, 0, 0.2]) fireBullet(player, false, player.angle + off); }
    else fireBullet(player, false);
  }
  function burst(x, y, color, n=14) {
    for (let i=0;i<n;i++) { const a=rand(0, Math.PI*2), s=rand(1,4); particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rand(20,40),color}); }
  }
  function buffColor(t) { return t==='heal'?'#7fffd4': t==='multishot'?'#ffd27b':'#9b8cff'; }
  function buffIcon(t) { return t==='heal'?'+': t==='multishot'?'⋙':'♥'; }
  function buffName(t) { return t==='heal'?'治疗': t==='multishot'?'多发':'队友'; }
  function floatText(x,y,text,color) { floaters.push({x,y,text,color,life:50}); }
  function applyBuff(type) {
    playSound('buff');
    if (type==='heal') { player.hp = Math.min(player.maxHp, player.hp+35); updateHUD(); floatText(player.x,player.y-34,'+35 HP','#7fffd4'); }
    else if (type==='multishot') { player.multishot = 720; floatText(player.x,player.y-34,'多发子弹!','#ffd27b'); }
    else if (type==='teammate') {
      if (teammates.length < 2) { teammates.push({ x:player.x-36, y:player.y+36, r:16, angle:0, hp:30, maxHp:30, cooldown:0 }); floatText(player.x,player.y-34,'队友支援!','#9b8cff'); }
      else { player.hp = Math.min(player.maxHp, player.hp+25); updateHUD(); floatText(player.x,player.y-34,'+25 HP','#7fffd4'); }
    }
  }
  function hurtEnemy(e, dmg) {
    if (e.dead) return;
    e.hp -= dmg; burst(e.x, e.y, '#ffd27b', 8);
    if (e.hp <= 0) { e.dead = true; state.score += 10*state.wave; state.coins += 20*state.wave; burst(e.x,e.y,'#ff7b7b',18); playSound('explode'); updateHUD(); if (e.boss) onBossDeath(e); }
  }
  function selectSkill(i) { activeSkill=i; floatText(player.x, player.y-40, '技能: '+SKILLS[i].name, '#9b8cff'); }
  function activateSkill() {
    const s = SKILLS[activeSkill];
    if (skillCd[activeSkill]>0) { floatText(player.x,player.y-40,'技能冷却中','#ff9b9b'); return; }
    if (state.coins < s.cost) { floatText(player.x,player.y-40,'积分不足','#ff9b9b'); playSound('deny'); return; }
    state.coins -= s.cost; skillCd[activeSkill] = s.cd; updateHUD();
    if (activeSkill===0) castLaser(); else if (activeSkill===1) castMissile(); else castSword();
  }
  function castLaser() {
    const ang = player.angle, len = 780;
    for (const e of enemies) {
      const rx = e.x-player.x, ry = e.y-player.y;
      const proj = rx*Math.cos(ang)+ry*Math.sin(ang);
      if (proj<0||proj>len) continue;
      const perp = Math.abs(-rx*Math.sin(ang)+ry*Math.cos(ang));
      if (perp < e.r+7) hurtEnemy(e, 3);
    }
    effects.push({ type:'laser', x:player.x, y:player.y, angle:ang, len, life:10, color:'#7fffd4' });
    playSound('laser');
  }
  function castMissile() {
    missiles.push({ x:player.x+Math.cos(player.angle)*(player.r+6), y:player.y+Math.sin(player.angle)*(player.r+6), vx:Math.cos(player.angle)*4, vy:Math.sin(player.angle)*4, life:180, turn:0.09 });
    playSound('launch');
  }
  function castSword() {
    const R = 190;
    for (const e of enemies) if (dist(player.x,player.y,e.x,e.y)<R+e.r) hurtEnemy(e,2);
    effects.push({ type:'ring', x:player.x, y:player.y, r:10, maxR:R, life:18, color:'#9b8cff' });
    playSound('sword');
  }
  function explode(x,y,r,dmg) {
    for (const e of enemies) if (dist(x,y,e.x,e.y)<r+e.r) hurtEnemy(e,dmg);
    burst(x,y,'#ff9b4b',18); playSound('explode');
  }

  // ---- 状态 ----
  const state = { running:false, paused:false, over:false, win:false, wave:1, score:0, coins:0, toSpawn:0, spawnTimer:0, intermission:false, interTimer:0, muted:false, mapIdx:0, skinIdx:0 };

  function startGame() {
    buildObstacles();
    player.x = W/2; player.y = H-100; player.hp = player.maxHp;
    player.angle = -Math.PI/2; player.multishot = 0;
    bullets=[]; enemies=[]; teammates=[]; buffs=[]; particles=[]; floaters=[]; missiles=[]; effects=[];
    skillCd=[0,0,0]; activeSkill=0;
    state.running=true; state.paused=false; state.over=false; state.win=false; state.wave=1; state.score=0; state.coins=0; state.intermission=false; state.interTimer=0;
    startWave(1); overlay.classList.add('hidden'); updateHUD();
  }
  function startWave(n) {
    state.wave = n; state.spawnTimer = 0;
    if (n===4 || n===8) { state.toSpawn = 0; spawnBoss(n); }
    else state.toSpawn = 2 + n;
    updateHUD();
  }
  function spawnWaveBuffs(n) {
    const types = ['heal','multishot','teammate'];
    for (let i=0;i<n;i++) {
      const ang = rand(0, Math.PI*2), rad = rand(90, 150);
      let bx = clamp(player.x + Math.cos(ang)*rad, 40, W-40);
      let by = clamp(player.y + Math.sin(ang)*rad, 40, H-40);
      const type = types[Math.floor(Math.random()*types.length)];
      buffs.push({ x:bx, y:by, r:16, type, pulse:0, life:9999, label:buffName(type) });
    }
  }
  function gameOver(win) {
    state.running=false; state.over=true; state.win=win;
    overlay.classList.remove('hidden');
    overlay.querySelector('h1').textContent = win?'🏆 胜利！':'！';
    overlay.querySelector('p').innerHTML = win
      ? `你守住了所有阵地！<br>地图 <b style="color:#7fffd4">${MAPS[state.mapIdx].name}</b> · 皮肤 <b style="color:#7fffd4">${SKINS[state.skinIdx].name}</b><br>最终分数 <b style="color:#7fffd4">${state.score}</b>`
      : `你被击毁了。<br>地图 <b style="color:#7fffd4">${MAPS[state.mapIdx].name}</b> · 皮肤 <b style="color:#7fffd4">${SKINS[state.skinIdx].name}</b><br>分数 <b style="color:#7fffd4">${state.score}</b> · 到达第 <b style="color:#7fffd4">${state.wave}</b> 波`;
    startBtn.textContent = '再来一局';
  }
  function togglePause() {
    state.paused = !state.paused;
    if (state.paused) { overlay.classList.remove('hidden'); overlay.querySelector('h1').textContent='⏸ 已暂停'; overlay.querySelector('p').textContent='按 P 或点击下方按钮继续'; startBtn.textContent='继续'; }
    else overlay.classList.add('hidden');
  }
  function toggleMute() { state.muted=!state.muted; floatText(player.x,player.y-40, state.muted?'已静音':'声音开','#cdd6ff'); }
  function updateHUD() {
    hpEl.textContent = Math.max(0,Math.round(player.hp));
    waveEl.textContent = state.wave;
    scoreEl.textContent = state.score;
    coinsEl.textContent = state.coins;
  }

  // ---- 碰撞 ----
  function slideMove(obj, nx, ny) {
    let x = clamp(nx,obj.r,W-obj.r), y = clamp(ny,obj.r,H-obj.r);
    const boxX = { x:x-obj.r, y:obj.y-obj.r, w:obj.r*2, h:obj.r*2 };
    if (obstacles.some(o => rectsOverlap(boxX,o))) x = obj.x;
    const boxY = { x:x-obj.r, y:y-obj.r, w:obj.r*2, h:obj.r*2 };
    if (obstacles.some(o => rectsOverlap(boxY,o))) y = obj.y;
    return {x,y};
  }
  function pushOutOfObstacles(obj) {
    for (const o of obstacles) {
      const box = { x:obj.x-obj.r, y:obj.y-obj.r, w:obj.r*2, h:obj.r*2 };
      if (!rectsOverlap(box,o)) continue;
      const left=(obj.x+obj.r)-o.x, right=(o.x+o.w)-(obj.x-obj.r), top=(obj.y+obj.r)-o.y, bottom=(o.y+o.h)-(obj.y-obj.r);
      const m = Math.min(left,right,top,bottom);
      if (m===left) obj.x=o.x-obj.r; else if (m===right) obj.x=o.x+o.w+obj.r;
      else if (m===top) obj.y=o.y-obj.r; else obj.y=o.y+o.h+obj.r;
    }
    obj.x=clamp(obj.x,obj.r,W-obj.r); obj.y=clamp(obj.y,obj.r,H-obj.r);
  }

  function update() {
    if (!state.running || state.paused) return;
    for (let i=0;i<skillCd.length;i++) if (skillCd[i]>0) skillCd[i]--;

    let dx=0, dy=0;
    if (keys['w']||keys['arrowup']) dy-=1;
    if (keys['s']||keys['arrowdown']) dy+=1;
    if (keys['a']||keys['arrowleft']) dx-=1;
    if (keys['d']||keys['arrowright']) dx+=1;
    if (dx||dy) {
      const len=Math.hypot(dx,dy);
      const mv=slideMove(player, player.x+dx/len*player.speed, player.y+dy/len*player.speed);
      player.x=mv.x; player.y=mv.y;
    }
    let target=null, best=1e9;
    for (const e of enemies) { const dd=dist(player.x,player.y,e.x,e.y); if (dd<best){best=dd;target=e;} }
    if (target) player.angle = Math.atan2(target.y-player.y, target.x-player.x);
    if (player.multishot>0) player.multishot--;
    player.cooldown--;
    if (player.cooldown<=0 && (target||keys[' '])) { firePlayer(); player.cooldown=16; }

    if (state.toSpawn>0) {
      state.spawnTimer--;
      if (state.spawnTimer<=0) { spawnEnemy(); state.toSpawn--; state.spawnTimer=70; }
    } else if (enemies.length===0) {
      if (state.wave>=8) { gameOver(true); return; }
      if (!state.intermission) { state.intermission=true; state.interTimer=240; spawnWaveBuffs(2); playSound('waveclear'); floatText(player.x,player.y-44,'本波清空！捡取 buff','#7fffd4'); }
    }
    if (state.intermission) { state.interTimer--; if (state.interTimer<=0) { state.intermission=false; startWave(state.wave+1); } }

    const minDistToPlayer = 30;
    for (const e of enemies) {
      if (e.boss) { updateBoss(e); continue; }
      const ang = Math.atan2(player.y-e.y, player.x-e.x);
      const d = dist(e.x,e.y,player.x,player.y);
      let nx=e.x, ny=e.y;
      if (d > e.r+player.r+minDistToPlayer) { nx=e.x+Math.cos(ang)*e.speed; ny=e.y+Math.sin(ang)*e.speed; }
      const mv=slideMove(e,nx,ny); e.x=mv.x; e.y=mv.y; e.angle=ang;
      e.cooldown--;
      if (e.cooldown<=0 && d<480) { fireBullet(e,true,undefined,e.dmg); e.cooldown=rand(70,130); }
    }
    for (let i=0;i<enemies.length;i++) for (let j=i+1;j<enemies.length;j++) {
      const a=enemies[i],b=enemies[j], d=dist(a.x,a.y,b.x,b.y), min=a.r+b.r;
      if (d>0 && d<min) { const push=(min-d)/2, ux=(a.x-b.x)/d, uy=(a.y-b.y)/d; a.x+=ux*push;a.y+=uy*push;b.x-=ux*push;b.y-=uy*push; }
    }
    for (const e of enemies) {
      const d=dist(e.x,e.y,player.x,player.y), min=e.r+player.r;
      if (d>0 && d<min) { const push=min-d; e.x+=(e.x-player.x)/d*push; e.y+=(e.y-player.y)/d*push; }
      pushOutOfObstacles(e);
    }
    for (const tm of teammates) {
      const tx=player.x-Math.cos(player.angle)*46, ty=player.y-Math.sin(player.angle)*46, d=dist(tm.x,tm.y,tx,ty);
      if (d>8) { const a=Math.atan2(ty-tm.y,tx-tm.x); const mv=slideMove(tm,tm.x+Math.cos(a)*2.8,tm.y+Math.sin(a)*2.8); tm.x=mv.x; tm.y=mv.y; }
      let tgt=null, bd=1e9;
      for (const e of enemies) { const dd=dist(tm.x,tm.y,e.x,e.y); if (dd<bd){bd=dd;tgt=e;} }
      if (tgt) { tm.angle=Math.atan2(tgt.y-tm.y,tgt.x-tm.x); tm.cooldown--; if (tm.cooldown<=0 && bd<460){ fireBullet(tm,false); tm.cooldown=26; } }
      pushOutOfObstacles(tm);
    }
    for (const b of bullets) {
      b.x+=b.vx; b.y+=b.vy; b.life--;
      if (b.x<0||b.x>W||b.y<0||b.y>H) b.life=0;
      for (const o of obstacles) {
        if (circleRect(b.x,b.y,b.r,o)) {
          b.life=0;
          if (o.type==='wall') { o.hp--; burst(b.x,b.y,'#c89b6b',6); if (o.hp<=0){ o.dead=true; burst(o.x+o.w/2,o.y+o.h/2,'#c89b6b',16); } }
          else burst(b.x,b.y,'#9fb0d0',8);
          break;
        }
      }
      if (b.life<=0) continue;
      if (b.fromEnemy) {
        if (dist(b.x,b.y,player.x,player.y)<player.r+b.r) {
          player.hp -= b.dmg||9; b.life=0; burst(player.x,player.y,'#ff5b5b',10); playSound('hit'); updateHUD();
          if (player.hp<=0){gameOver(false);return;}
        } else {
          for (const tm of teammates) { if (tm.dead) continue; if (dist(b.x,b.y,tm.x,tm.y)<tm.r+b.r){ tm.hp-=b.dmg||9; b.life=0; burst(tm.x,tm.y,'#9b8cff',10); if (tm.hp<=0){tm.dead=true;burst(tm.x,tm.y,'#9b8cff',16);} break; } }
        }
      } else {
        for (const e of enemies) { if (e.dead) continue; if (dist(b.x,b.y,e.x,e.y)<e.r+b.r){ b.life=0; hurtEnemy(e,1); break; } }
      }
    }
    bullets=bullets.filter(b=>b.life>0); obstacles=obstacles.filter(o=>!o.dead); enemies=enemies.filter(e=>!e.dead); teammates=teammates.filter(t=>!t.dead);
    for (const m of missiles) {
      m.life--;
      let tgt=null, bd=1e9;
      for (const e of enemies) { const dd=dist(m.x,m.y,e.x,e.y); if (dd<bd){bd=dd;tgt=e;} }
      if (tgt) { const a=Math.atan2(tgt.y-m.y,tgt.x-m.x), ca=Math.atan2(m.vy,m.vx); let da=a-ca; while(da>Math.PI)da-=Math.PI*2; while(da<-Math.PI)da+=Math.PI*2; const na=ca+Math.max(-m.turn,Math.min(m.turn,da)), sp=Math.hypot(m.vx,m.vy); m.vx=Math.cos(na)*sp; m.vy=Math.sin(na)*sp; }
      m.x+=m.vx; m.y+=m.vy;
      let hit=false;
      for (const e of enemies) { if (dist(m.x,m.y,e.x,e.y)<e.r+6){ hurtEnemy(e,3); hit=true; break; } }
      if (hit||m.life<=0||m.x<-20||m.x>W+20||m.y<-20||m.y>H+20){ explode(m.x,m.y,60,2); m.dead=true; }
    }
    missiles=missiles.filter(m=>!m.dead);
    for (const bf of buffs) {
      bf.pulse+=0.1;
      const d=dist(bf.x,bf.y,player.x,player.y);
      if (d<160){ bf.x+=(player.x-bf.x)*0.14; bf.y+=(player.y-bf.y)*0.14; }
      if (d<player.r+bf.r){ applyBuff(bf.type); bf.dead=true; burst(bf.x,bf.y,buffColor(bf.type),14); }
    }
    buffs=buffs.filter(b=>!b.dead);
    for (const ef of effects) { ef.life--; if (ef.type==='ring') ef.r+=(ef.maxR-ef.r)*0.25; }
    effects=effects.filter(e=>e.life>0);
    for (const p of particles) { p.x+=p.vx; p.y+=p.vy; p.life--; p.vx*=0.94; p.vy*=0.94; }
    particles=particles.filter(p=>p.life>0);
    for (const f of floaters) { f.y-=0.5; f.life--; }
    floaters=floaters.filter(f=>f.life>0);
  }

  // ---- 渲染 ----
  function drawTank(t, kind) {
    ctx.save(); ctx.translate(t.x,t.y); ctx.rotate(t.angle);
    // 履带
    ctx.fillStyle='#1b2036';
    ctx.fillRect(-t.r,-t.r-4,t.r*2,6); ctx.fillRect(-t.r,t.r-2,t.r*2,6);
    // 车身 / 炮塔 / 顶
    let body, turret, dome;
    if (kind==='player') { const sk=SKINS[state.skinIdx]; body=sk.palette.body; turret=sk.palette.turret; dome=sk.palette.dome; }
    else if (kind==='ally') { body='#9b8cff'; turret='#6c5bd6'; dome='#e6e0ff'; }
    else if (kind==='boss') { body='#7a1f3d'; turret='#ff3b6b'; dome='#ffd7d7'; }
    else { body='#3a2230'; turret='#ff5b5b'; dome='#ffd7d7'; }
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(0,0,t.r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle=turret; ctx.fillRect(0,-5,t.r+14,10);
    ctx.beginPath(); ctx.arc(0,0,t.r*0.45,0,Math.PI*2); ctx.fillStyle=dome; ctx.fill();
    ctx.restore();
  }

  // 玩家皮肤贴图（精灵图）绘制
  function drawPlayerSprite() {
    const sk = SKINS[state.skinIdx];
    if (sk.img && sk.img.complete && sk.img.naturalWidth) {
      ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle + Math.PI/2);
      const len = player.r * 2.6;            // 沿炮塔方向的长度
      const w = len, h = len * (sk.img.naturalHeight / sk.img.naturalWidth);
      ctx.drawImage(sk.img, -w/2, -h/2, w, h);
      ctx.restore();
    } else {
      drawTank(player, 'player');
    }
  }

  function drawBackground() {
    const mp = MAPS[state.mapIdx];
    const grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, mp.bg[0]); grad.addColorStop(1, mp.bg[1]);
    ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
    // 装饰
    if (mp.decor === 'base') {
      ctx.strokeStyle = 'rgba(255,255,255,'+mp.gridAlpha+')'; ctx.lineWidth=1;
      for (let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for (let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    } else if (mp.decor === 'jungle') {
      // 散落的树冠
      const trees = [{x:80,y:80,r:46},{x:800,y:60,r:50},{x:60,y:330,r:40},{x:820,y:340,r:44},{x:200,y:580,r:38},{x:680,y:580,r:42},{x:430,y:150,r:34},{x:440,y:520,r:36}];
      for (const t of trees) {
        ctx.fillStyle='rgba(20,50,20,.55)'; ctx.beginPath(); ctx.arc(t.x,t.y,t.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(60,100,50,.45)'; ctx.beginPath(); ctx.arc(t.x-6,t.y-6,t.r*0.7,0,Math.PI*2); ctx.fill();
      }
      // 网格淡线
      ctx.strokeStyle='rgba(120,200,120,.04)'; ctx.lineWidth=1;
      for (let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for (let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    } else if (mp.decor === 'desert') {
      // 沙丘光晕
      for (let i=0;i<6;i++) {
        const cx=(i*173+90)%W, cy=(i*97+120)%H;
        const rg=ctx.createRadialGradient(cx,cy,8,cx,cy,110);
        rg.addColorStop(0,'rgba(230,200,140,.22)'); rg.addColorStop(1,'rgba(230,200,140,0)');
        ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(cx,cy,110,0,Math.PI*2); ctx.fill();
      }
      // 仙人掌 / 岩石
      const cacti = [{x:90,y:360,h:42},{x:820,y:380,h:50},{x:200,y:170,h:36},{x:700,y:160,h:40}];
      for (const c of cacti) {
        ctx.fillStyle='#3a6b3a';
        ctx.fillRect(c.x-5,c.y-c.h,10,c.h);
        ctx.fillRect(c.x-14,c.y-c.h*0.6,8,18);
        ctx.fillRect(c.x+6,c.y-c.h*0.7,8,16);
      }
      const rocks = [{x:740,y:540,r:16},{x:120,y:540,r:14},{x:440,y:90,r:18}];
      for (const r of rocks) {
        ctx.fillStyle='#7a5a3a'; ctx.beginPath(); ctx.arc(r.x,r.y,r.r,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#9a7a5a'; ctx.beginPath(); ctx.arc(r.x-3,r.y-4,r.r*0.6,0,Math.PI*2); ctx.fill();
      }
      ctx.strokeStyle='rgba(230,200,140,.05)'; ctx.lineWidth=1;
      for (let x=0;x<=W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for (let y=0;y<=H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    }
  }

  function render() {
    drawBackground();
    const mp = MAPS[state.mapIdx];
    for (const o of obstacles) {
      if (o.type==='steel') { ctx.fillStyle=mp.steel[0]; ctx.fillRect(o.x,o.y,o.w,o.h); ctx.strokeStyle=mp.steel[1]; ctx.lineWidth=2; ctx.strokeRect(o.x+2,o.y+2,o.w-4,o.h-4); }
      else { const dmg=o.hp<=1?'#6a4a2a':(o.hp===2?'#8a6a44':'#a87a3d'); ctx.fillStyle=dmg; ctx.fillRect(o.x,o.y,o.w,o.h); ctx.strokeStyle='#3a2a18'; ctx.lineWidth=2;
        for (let i=o.x;i<o.x+o.w;i+=14){ctx.beginPath();ctx.moveTo(i,o.y);ctx.lineTo(i,o.y+o.h);ctx.stroke();} }
    }
    for (const bf of buffs) {
      const col=buffColor(bf.type), pr=bf.r+Math.sin(bf.pulse)*2.5;
      ctx.shadowColor=col; ctx.shadowBlur=16; ctx.fillStyle=col;
      ctx.beginPath(); ctx.arc(bf.x,bf.y,pr,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
      ctx.fillStyle='#0d0f1a'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(buffIcon(bf.type),bf.x,bf.y+1);
      ctx.fillStyle=col; ctx.font='bold 11px sans-serif'; ctx.fillText(bf.label||buffName(bf.type),bf.x,bf.y-pr-8);
    }
    for (const tm of teammates) {
      drawTank(tm,'ally');
      const bw=34,bx=tm.x-bw/2,by=tm.y-tm.r-14;
      ctx.fillStyle='#000'; ctx.fillRect(bx-1,by-1,bw+2,5);
      ctx.fillStyle='#5b6390'; ctx.fillRect(bx,by,bw,3);
      ctx.fillStyle='#9b8cff'; ctx.fillRect(bx,by,bw*clamp(tm.hp/tm.maxHp,0,1),3);
    }
    for (const p of particles) { ctx.globalAlpha=clamp(p.life/40,0,1); ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,3,0,Math.PI*2); ctx.fill(); }
    ctx.globalAlpha=1;
    for (const b of bullets) {
      ctx.fillStyle=b.fromEnemy?'#ff6b6b':'#9bffea';
      ctx.shadowColor=b.fromEnemy?'#ff6b6b':'#9bffea'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    }
    for (const m of missiles) {
      ctx.fillStyle='#ff9b4b'; ctx.shadowColor='#ff9b4b'; ctx.shadowBlur=10;
      ctx.beginPath(); ctx.arc(m.x,m.y,5,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    }
    for (const ef of effects) {
      if (ef.type==='laser') {
        ctx.globalAlpha=ef.life/10; ctx.strokeStyle=ef.color; ctx.lineWidth=8; ctx.shadowColor=ef.color; ctx.shadowBlur=16;
        ctx.beginPath(); ctx.moveTo(ef.x,ef.y); ctx.lineTo(ef.x+Math.cos(ef.angle)*ef.len, ef.y+Math.sin(ef.angle)*ef.len); ctx.stroke();
        ctx.shadowBlur=0; ctx.globalAlpha=1;
      } else if (ef.type==='ring') {
        ctx.globalAlpha=ef.life/18; ctx.strokeStyle=ef.color; ctx.lineWidth=4; ctx.shadowColor=ef.color; ctx.shadowBlur=12;
        ctx.beginPath(); ctx.arc(ef.x,ef.y,ef.r,0,Math.PI*2); ctx.stroke();
        ctx.shadowBlur=0; ctx.globalAlpha=1;
      }
    }
    for (const e of enemies) drawTank(e, e.boss?'boss':'enemy');
    if (!state.over) drawPlayerSprite();

    const boss = enemies.find(e => e.boss);
    if (boss) {
      const bw=420,bx=W/2-bw/2,by=16;
      ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(bx-2,by-2,bw+4,16);
      ctx.fillStyle='#3a1020'; ctx.fillRect(bx,by,bw,12);
      ctx.fillStyle='#ff3b6b'; ctx.fillRect(bx,by,bw*clamp(boss.hp/boss.maxHp,0,1),12);
      ctx.fillStyle='#ffd7d7'; ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('BOSS',W/2,by+6);
    }
    if (!state.over) {
      const bw=40,bx=player.x-bw/2,by=player.y-player.r-16;
      ctx.fillStyle='#000'; ctx.fillRect(bx-1,by-1,bw+2,6);
      ctx.fillStyle='#ff5b5b'; ctx.fillRect(bx,by,bw,4);
      ctx.fillStyle='#7fffd4'; ctx.fillRect(bx,by,bw*clamp(player.hp/player.maxHp,0,1),4);
      if (player.multishot>0) {
        ctx.font='bold 12px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.fillStyle='#ffd27b';
        ctx.fillText('⚡多发 '+Math.ceil(player.multishot/60)+'s', player.x, by-4);
      }
    }
    if (!state.over) {
      const skW=84,skH=32,gap=8,total=SKILLS.length*skW+(SKILLS.length-1)*gap;
      const sx=W/2-total/2, sy=H-56;
      for (let i=0;i<SKILLS.length;i++) {
        const s=SKILLS[i],x=sx+i*(skW+gap);
        ctx.fillStyle=i===activeSkill?'rgba(123,255,212,.18)':'rgba(20,24,40,.7)'; ctx.fillRect(x,sy,skW,skH);
        ctx.strokeStyle=i===activeSkill?'#7fffd4':'#313862'; ctx.lineWidth=2; ctx.strokeRect(x,sy,skW,skH);
        ctx.fillStyle=i===activeSkill?'#7fffd4':'#cdd6ff'; ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText((i+1)+' '+s.name, x+skW/2, sy+12);
        ctx.fillStyle='#9aa3cc'; ctx.font='10px sans-serif';
        ctx.fillText(skillCd[i]>0?'冷却'+Math.ceil(skillCd[i]/60)+'s':(s.cost+'分'), x+skW/2, sy+25);
      }
      ctx.fillStyle='#5b6390'; ctx.font='10px sans-serif'; ctx.textAlign='center';
      ctx.fillText('F 释放', sx+total/2, sy-6);
    }
    for (const f of floaters) {
      ctx.globalAlpha=clamp(f.life/50,0,1);
      ctx.font='bold 14px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillStyle=f.color;
      ctx.fillText(f.text,f.x,f.y); ctx.globalAlpha=1;
    }
  }

  function loop() { update(); render(); requestAnimationFrame(loop); }

  // ---- 地图 / 皮肤 选择 UI ----
  function buildChips() {
    mapChipsEl.innerHTML = '';
    MAPS.forEach((m, i) => {
      const b = document.createElement('button');
      b.className = 'chip' + (i === state.mapIdx ? ' active' : '');
      b.textContent = m.name;
      b.onclick = () => { state.mapIdx = i; buildChips(); buildObstacles(); };
      mapChipsEl.appendChild(b);
    });
    skinChipsEl.innerHTML = '';
    SKINS.forEach((s, i) => {
      const b = document.createElement('button');
      b.className = 'chip swatch' + (i === state.skinIdx ? ' active' : '');
      const dot = document.createElement('span');
      dot.className = 'swatch-dot'; dot.style.background = s.palette.body;
      b.appendChild(dot);
      const txt = document.createElement('span'); txt.textContent = s.name;
      b.appendChild(txt);
      b.onclick = () => { state.skinIdx = i; buildChips(); };
      skinChipsEl.appendChild(b);
    });
  }

  startBtn.addEventListener('click', () => {
    initAudio();
    if (state.paused) { togglePause(); return; }
    startGame();
  });

  buildChips();
  buildObstacles();
  render();
  loop();
})();
</script>
</body>
</html>
